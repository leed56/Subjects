name: LakBiz Stock Correctness Patch

on:
  push:
    branches:
      - claude/global-premium-ui
    paths:
      - .github/workflows/lakbiz-stock-correctness-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lakbiz/app/package-lock.json

      - name: Apply audited Stock and sync fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('lakbiz/app')

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1))

          # 1) Generic pagination primitive. It advances by the number of rows
          # actually returned, so it remains correct even if PostgREST applies a
          # server cap lower than the requested range size.
          pagination = ROOT / 'src/lib/supabase/pagination.ts'
          pagination.write_text('''export type PageResult<T> = {\n  data: T[] | null;\n  error: { message: string } | null;\n};\n\nconst DEFAULT_PAGE_SIZE = 500;\nconst MAX_PAGES = 10_000;\n\n/**\n * Fetch a complete PostgREST collection without assuming the server's max-row\n * setting. The next range begins after the number of rows actually returned,\n * which prevents gaps when the server cap is smaller than our requested page.\n */\nexport async function fetchAllPages<T>(\n  fetchPage: (from: number, to: number) => PromiseLike<PageResult<T>>,\n  pageSize = DEFAULT_PAGE_SIZE,\n): Promise<PageResult<T>> {\n  if (!Number.isInteger(pageSize) || pageSize < 1) {\n    throw new Error("pageSize must be a positive integer");\n  }\n\n  const data: T[] = [];\n  let from = 0;\n\n  for (let page = 0; page < MAX_PAGES; page += 1) {\n    const result = await fetchPage(from, from + pageSize - 1);\n    if (result.error) return { data: null, error: result.error };\n\n    const rows = result.data ?? [];\n    if (rows.length === 0) return { data, error: null };\n\n    data.push(...rows);\n    from += rows.length;\n  }\n\n  return {\n    data: null,\n    error: { message: "Pagination safety limit exceeded" },\n  };\n}\n''')

          pagination_test = ROOT / 'src/lib/supabase/pagination.test.ts'
          pagination_test.write_text('''import { describe, expect, it } from "vitest";\nimport { fetchAllPages } from "./pagination";\n\ndescribe("fetchAllPages", () => {\n  it("loads beyond 1000 rows when the server returns smaller capped pages", async () => {\n    const source = Array.from({ length: 1385 }, (_, index) => index);\n    const serverCap = 173;\n    const calls: Array<[number, number]> = [];\n\n    const result = await fetchAllPages(async (from, to) => {\n      calls.push([from, to]);\n      const endExclusive = Math.min(to + 1, from + serverCap, source.length);\n      return { data: source.slice(from, endExclusive), error: null };\n    }, 500);\n\n    expect(result.error).toBeNull();\n    expect(result.data).toHaveLength(1385);\n    expect(result.data?.[0]).toBe(0);\n    expect(result.data?.at(-1)).toBe(1384);\n    expect(calls[1]?.[0]).toBe(173);\n  });\n\n  it("returns an empty collection cleanly", async () => {\n    const result = await fetchAllPages(async () => ({ data: [], error: null }));\n    expect(result).toEqual({ data: [], error: null });\n  });\n\n  it("stops and preserves a page error", async () => {\n    let calls = 0;\n    const result = await fetchAllPages(async () => {\n      calls += 1;\n      if (calls === 1) return { data: [1, 2], error: null };\n      return { data: null, error: { message: "network" } };\n    }, 2);\n\n    expect(result.data).toBeNull();\n    expect(result.error?.message).toBe("network");\n    expect(calls).toBe(2);\n  });\n});\n''')

          # 2) Make every org-wide collection in pullBusinessData cap-safe.
          sync_path = ROOT / 'src/lib/supabase/business-sync.ts'
          sync = sync_path.read_text()
          import_anchor = 'import { createBrowserClient } from "./client";\n'
          if 'from "./pagination"' not in sync:
              if import_anchor not in sync:
                  raise SystemExit('business-sync import anchor not found')
              sync = sync.replace(import_anchor, import_anchor + 'import { fetchAllPages } from "./pagination";\n', 1)

          pull_start = sync.index('export async function pullBusinessData(')
          block_start = sync.index('] = await Promise.all([', pull_start)
          block_end = sync.index('\n\n  if (productsRes.error', block_start)
          block = sync[block_start:block_end]
          pattern = re.compile(r'supabase\s*\.from\("([^"]+)"\)\s*\.select\("\*"\)\s*\.eq\("organization_id", organizationId\)')
          block, count = pattern.subn(
              lambda m: f'fetchAllPages((from, to) => supabase.from("{m.group(1)}").select("*").eq("organization_id", organizationId).range(from, to))',
              block,
          )
          if count != 24:
              raise SystemExit(f'pullBusinessData pagination: expected 24 collection queries, patched {count}')
          sync = sync[:block_start] + block + sync[block_end:]

          old_cost_query = '''  const { data: rows } = await supabase\n    .from("products")\n    .select("id, buy_price")\n    .eq("organization_id", organizationId);'''
          new_cost_query = '''  const { data: rows } = await fetchAllPages((from, to) =>\n    supabase\n      .from("products")\n      .select("id, buy_price")\n      .eq("organization_id", organizationId)\n      .range(from, to),\n  );'''
          if sync.count(old_cost_query) != 1:
              raise SystemExit(f'preserved buy-price query: expected 1 match, found {sync.count(old_cost_query)}')
          sync = sync.replace(old_cost_query, new_cost_query, 1)
          sync_path.write_text(sync)

          # 3) Expose organization/subscription readiness so authenticated pages
          # cannot operate on the anonymous grocery default while cloud org lookup
          # is still in flight.
          types_path = ROOT / 'src/lib/subscription/types.ts'
          replace_once(
              types_path,
              'export interface SubscriptionContextValue {\n  org: OrganizationState;\n',
              'export interface SubscriptionContextValue {\n  ready: boolean;\n  org: OrganizationState;\n',
              'subscription context ready field',
          )

          provider_path = ROOT / 'src/lib/subscription/subscription-provider.tsx'
          provider = provider_path.read_text()
          provider = provider.replace('  const [ready] = useState(true);', '  const [ready, setReady] = useState(false);', 1)
          old_effect = '''  useEffect(() => {\n    if (authLoading) return;\n\n    if (!user) {\n      setIsPlatformAdmin(false);\n      setSubscription(loadDemoSubscription());\n      setOrg(loadDemoOrg());\n      return;\n    }\n\n    void loadFromCloud().catch(() => {\n      setSubscription(loadDemoSubscription());\n      setOrg(loadDemoOrg());\n    });\n  }, [user, authLoading, loadFromCloud]);'''
          new_effect = '''  useEffect(() => {\n    let cancelled = false;\n\n    if (authLoading) {\n      setReady(false);\n      return () => {\n        cancelled = true;\n      };\n    }\n\n    setReady(false);\n    if (!user) {\n      setIsPlatformAdmin(false);\n      setSubscription(loadDemoSubscription());\n      setOrg(loadDemoOrg());\n      setReady(true);\n      return () => {\n        cancelled = true;\n      };\n    }\n\n    void loadFromCloud()\n      .then(() => {\n        if (!cancelled) setReady(true);\n      })\n      .catch(() => {\n        if (cancelled) return;\n        setSubscription(loadDemoSubscription());\n        setOrg(loadDemoOrg());\n        setReady(true);\n      });\n\n    return () => {\n      cancelled = true;\n    };\n  }, [user, authLoading, loadFromCloud]);'''
          if provider.count(old_effect) != 1:
              raise SystemExit(f'subscription readiness effect: expected 1 match, found {provider.count(old_effect)}')
          provider = provider.replace(old_effect, new_effect, 1)
          provider = provider.replace('    () => ({\n      org,\n', '    () => ({\n      ready,\n      org,\n', 1)
          provider = provider.replace('    [\n      org,\n', '    [\n      ready,\n      org,\n', 1)
          provider = provider.replace('    return {\n      org: { id: null, name: "Demo Shop", sector: "grocery", isAuthenticated: false, role: "owner" },', '    return {\n      ready: true,\n      org: { id: null, name: "Demo Shop", sector: "grocery", isAuthenticated: false, role: "owner" },', 1)
          if 'ready,\n      org,' not in provider or 'ready: true,' not in provider:
              raise SystemExit('subscription provider ready wiring failed')
          provider_path.write_text(provider)

          # 4) The app store must not initialize tenant-local data until the
          # authenticated organization context is resolved.
          store_path = ROOT / 'src/lib/store/app-store-provider.tsx'
          store = store_path.read_text()
          old_destructure = '''  const { org, isReadOnly, subscription, can, orgRole, canSeeFinancials } =\n    useSubscription();'''
          new_destructure = '''  const {\n    ready: subscriptionReady,\n    org,\n    isReadOnly,\n    subscription,\n    can,\n    orgRole,\n    canSeeFinancials,\n  } = useSubscription();'''
          if store.count(old_destructure) != 1:
              raise SystemExit(f'app store subscription destructure: expected 1 match, found {store.count(old_destructure)}')
          store = store.replace(old_destructure, new_destructure, 1)
          old_init = '''  useEffect(() => {\n    setStorageOrgId(org.id);\n    const initial = loadAppData(org.id);'''
          new_init = '''  useEffect(() => {\n    if (!subscriptionReady || (user && !org.isAuthenticated)) {\n      setReady(false);\n      return;\n    }\n\n    setStorageOrgId(org.id);\n    const initial = loadAppData(org.id);'''
          if store.count(old_init) != 1:
              raise SystemExit(f'app store init effect: expected 1 match, found {store.count(old_init)}')
          store = store.replace(old_init, new_init, 1)
          old_deps = '  }, [org.id, refreshOfflinePendingState]);'
          new_deps = '  }, [subscriptionReady, user, org.id, org.isAuthenticated, refreshOfflinePendingState]);'
          if store.count(old_deps) != 1:
              raise SystemExit(f'app store init deps: expected 1 match, found {store.count(old_deps)}')
          store = store.replace(old_deps, new_deps, 1)
          store_path.write_text(store)

          # 5) Product form tracks a late-arriving locked shop sector instead of
          # retaining the anonymous grocery initializer.
          form_path = ROOT / 'src/components/product-form.tsx'
          form = form_path.read_text()
          form = form.replace('import { useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";', 1)
          form_anchor = '''  const [form, setForm] = useState<FormState>(() => {\n    if (initial) {'''
          if form_anchor not in form:
              raise SystemExit('product form state anchor not found')
          insert_after = '''    return emptyForm(shopSectorId);\n  });\n'''
          effect = '''    return emptyForm(shopSectorId);\n  });\n\n  useEffect(() => {\n    if (initial) return;\n    const sectorId = lockedSectorId ?? defaultSectorId;\n    setForm((current) => {\n      if (\n        current.sectorId === sectorId &&\n        categoriesForSector(sectorId).includes(current.category)\n      ) {\n        return current;\n      }\n      return emptyForm(sectorId);\n    });\n  }, [initial, lockedSectorId, defaultSectorId]);\n'''
          if form.count(insert_after) != 1:
              raise SystemExit(f'product form sector effect anchor: expected 1 match, found {form.count(insert_after)}')
          form = form.replace(insert_after, effect, 1)
          form_path.write_text(form)

          # 6) Stock UI: render 50 rows at a time, keep totals over the complete
          # collection, and mount the form only while its drawer is open.
          stock_path = ROOT / 'src/app/stock/page.tsx'
          stock = stock_path.read_text()
          stock = stock.replace('import { useState } from "react";', 'import { useEffect, useState } from "react";', 1)
          stock = stock.replace('type ConditionFilter = "all" | ProductCondition;\n', 'type ConditionFilter = "all" | ProductCondition;\n\nconst STOCK_PAGE_SIZE = 50;\n', 1)
          filter_anchor = '  const [showLowStockOnly, setShowLowStockOnly] = useState(false);\n'
          filter_add = '''  const [showLowStockOnly, setShowLowStockOnly] = useState(false);\n  const [page, setPage] = useState(1);\n\n  useEffect(() => {\n    setPage(1);\n  }, [search, conditionFilter, showInactive, showLowStockOnly]);\n'''
          if stock.count(filter_anchor) != 1:
              raise SystemExit('stock filter anchor not found')
          stock = stock.replace(filter_anchor, filter_add, 1)

          products_anchor = '  const products = showLowStockOnly ? byActive.filter((p) => lowStockIds.has(p.id)) : byActive;\n'
          products_add = '''  const products = showLowStockOnly ? byActive.filter((p) => lowStockIds.has(p.id)) : byActive;\n  const totalPages = Math.max(1, Math.ceil(products.length / STOCK_PAGE_SIZE));\n  const currentPage = Math.min(page, totalPages);\n  const pageStart = (currentPage - 1) * STOCK_PAGE_SIZE;\n  const pageProducts = products.slice(pageStart, pageStart + STOCK_PAGE_SIZE);\n'''
          if stock.count(products_anchor) != 1:
              raise SystemExit('stock products anchor not found')
          stock = stock.replace(products_anchor, products_add, 1)

          old_desc = '          description={`${products.length} ${t("common.items")} · ${t(org.isAuthenticated ? "common.saved_cloud" : "common.saved_browser")}`}\n'
          new_desc = '          description={`${products.length === data.products.length ? data.products.length : `${products.length} / ${data.products.length}`} ${t("common.items")} · ${t(org.isAuthenticated ? "common.saved_cloud" : "common.saved_browser")}`}\n'
          if stock.count(old_desc) != 1:
              raise SystemExit('stock page description anchor not found')
          stock = stock.replace(old_desc, new_desc, 1)

          old_table = '''        ) : (\n          <DataTable columns={columns} rows={products} emptyState={<EmptyState title={t("sales.no_match")} description={t("stock.search_no_match_desc")} />} />\n        )}'''
          new_table = '''        ) : (\n          <>\n            <DataTable columns={columns} rows={pageProducts} emptyState={<EmptyState title={t("sales.no_match")} description={t("stock.search_no_match_desc")} />} />\n            {products.length > STOCK_PAGE_SIZE && (\n              <div className="mt-3 flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-200/80 bg-white px-4 py-3 text-sm text-slate-600 shadow-[0_6px_20px_rgba(15,23,42,0.035)]">\n                <span className="font-medium">\n                  {pageStart + 1}–{Math.min(pageStart + STOCK_PAGE_SIZE, products.length)} / {products.length}\n                </span>\n                <div className="flex items-center gap-2">\n                  <button\n                    type="button"\n                    aria-label="Previous page"\n                    disabled={currentPage <= 1}\n                    onClick={() => setPage((value) => Math.max(1, value - 1))}\n                    className="inline-flex h-9 min-w-9 items-center justify-center rounded-lg border border-slate-200 bg-white px-3 font-semibold text-slate-700 hover:border-teal-200 hover:bg-teal-50 disabled:cursor-not-allowed disabled:opacity-40"\n                  >\n                    ←\n                  </button>\n                  <span className="min-w-[88px] text-center text-xs font-semibold uppercase tracking-[0.08em] text-slate-500">\n                    {currentPage} / {totalPages}\n                  </span>\n                  <button\n                    type="button"\n                    aria-label="Next page"\n                    disabled={currentPage >= totalPages}\n                    onClick={() => setPage((value) => Math.min(totalPages, value + 1))}\n                    className="inline-flex h-9 min-w-9 items-center justify-center rounded-lg border border-slate-200 bg-white px-3 font-semibold text-slate-700 hover:border-teal-200 hover:bg-teal-50 disabled:cursor-not-allowed disabled:opacity-40"\n                  >\n                    →\n                  </button>\n                </div>\n              </div>\n            )}\n          </>\n        )}'''
          if stock.count(old_table) != 1:
              raise SystemExit(f'stock table anchor: expected 1 match, found {stock.count(old_table)}')
          stock = stock.replace(old_table, new_table, 1)

          drawer_marker = '        <Drawer\n          open={formOpen}'
          drawer_start = stock.index(drawer_marker)
          drawer_end = stock.index('        </Drawer>', drawer_start)
          drawer = stock[drawer_start:drawer_end]
          if drawer.count('{editing ? (') != 1:
              raise SystemExit('stock drawer edit conditional anchor not found')
          drawer = drawer.replace('{editing ? (', '{formOpen && (editing ? (', 1)
          if not drawer.rstrip().endswith(')}'):
              raise SystemExit('stock drawer closing conditional shape changed')
          stripped = drawer.rstrip()
          stripped = stripped[:-2] + '))}'
          drawer = stripped + drawer[len(drawer.rstrip()):]
          stock = stock[:drawer_start] + drawer + stock[drawer_end:]
          stock_path.write_text(stock)

          print('Patched files:')
          for p in [pagination, pagination_test, sync_path, types_path, provider_path, store_path, form_path, stock_path]:
              print(' -', p)
          PY

      - name: Install dependencies
        working-directory: lakbiz/app
        run: npm ci

      - name: Verify patch
        working-directory: lakbiz/app
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Commit audited fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lakbiz-stock-correctness-patch.yml
          git config user.name "leed56"
          git config user.email "38248206+leed56@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: load complete stock and bind shop sector correctly"
          git push origin HEAD:claude/global-premium-ui
