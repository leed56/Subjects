name: LakBiz Deployed UI QA

on:
  workflow_dispatch:
    inputs:
      run_staging_roles:
        description: "Run authenticated journeys in the separately configured staging project"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - lakbiz/app/src/**
      - lakbiz/app/scripts/qa-deployed-ui.mjs
      - lakbiz/app/scripts/qa-sector-isolation.mjs
      - .github/workflows/lakbiz-deployed-ui-qa.yml

permissions:
  contents: read

concurrency:
  group: lakbiz-deployed-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    name: Ten-template deployed UI (no database writes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lakbiz/app
    env:
      LAKBIZ_EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LAKBIZ_UI_QA_DIR: /tmp/lakbiz-ui-qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Vercel branch preview
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          safe_branch="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$safe_branch" ]; then
            echo "Unable to resolve Vercel preview branch alias."
            exit 1
          fi
          echo "LAKBIZ_PREVIEW_URL=https://subjects-git-${safe_branch}-nexuserp.vercel.app" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browser for QA only
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Verify exact commit identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LAKBIZ_EXPECTED_BUILD_SHA:-}" ]; then
            echo "LAKBIZ_EXPECTED_BUILD_SHA is required to prevent stale-preview QA."
            exit 1
          fi
          if [ -z "${LAKBIZ_PREVIEW_URL:-}" ]; then
            echo "LAKBIZ_PREVIEW_URL is required for deployed browser QA."
            exit 1
          fi

      - name: Check all templates, languages and shop isolation without database writes
        run: node scripts/qa-sector-isolation.mjs

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakbiz-deployed-ui-qa
          path: /tmp/lakbiz-ui-qa/*
          if-no-files-found: warn
          retention-days: 7

  staging-roles:
    name: Authenticated staging journeys
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_roles
    environment: lakbiz-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lakbiz/app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.LAKBIZ_STAGING_SUPABASE_URL }}
      LAKBIZ_STAGING_SUPABASE_HOST: ${{ vars.LAKBIZ_STAGING_SUPABASE_HOST }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LAKBIZ_STAGING_SERVICE_ROLE_KEY }}
      LAKBIZ_PREVIEW_URL: ${{ vars.LAKBIZ_STAGING_PREVIEW_URL }}
      LAKBIZ_QA_PHARMACY_ORG: ${{ vars.LAKBIZ_QA_PHARMACY_ORG }}
      LAKBIZ_QA_GROCERY_ORG: ${{ vars.LAKBIZ_QA_GROCERY_ORG }}
      LAKBIZ_QA_HVAC_ORG: ${{ vars.LAKBIZ_QA_HVAC_ORG }}
      LAKBIZ_EXPECTED_BUILD_SHA: ${{ github.sha }}
      LAKBIZ_UI_QA_DIR: /tmp/lakbiz-staging-ui-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run signed-in journeys against staging only
        run: node scripts/qa-deployed-ui.mjs
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakbiz-staging-ui-qa
          path: /tmp/lakbiz-staging-ui-qa/*
          if-no-files-found: warn
          retention-days: 7
