name: LakBiz Deployed UI QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - lakbiz/app/src/**
      - lakbiz/app/scripts/qa-deployed-ui.mjs
      - .github/workflows/lakbiz-deployed-ui-qa.yml

permissions:
  contents: read

concurrency:
  group: lakbiz-deployed-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    name: HVAC, Pharmacy and Grocery deployed UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lakbiz/app
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://zestppstpwjxriwcuykc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LAKBIZ_EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LAKBIZ_UI_QA_DIR: /tmp/lakbiz-ui-qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Vercel branch preview
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          safe_branch="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$safe_branch" ]; then
            echo "Unable to resolve Vercel preview branch alias."
            exit 1
          fi
          echo "LAKBIZ_PREVIEW_URL=https://subjects-git-${safe_branch}-nexuserp.vercel.app" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browser for QA only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify secure browser-QA capability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is required for disposable visual-QA identities."
            exit 1
          fi
          if [ -z "${LAKBIZ_EXPECTED_BUILD_SHA:-}" ]; then
            echo "LAKBIZ_EXPECTED_BUILD_SHA is required to prevent stale-preview QA."
            exit 1
          fi
          if [ -z "${LAKBIZ_PREVIEW_URL:-}" ]; then
            echo "LAKBIZ_PREVIEW_URL is required for deployed browser QA."
            exit 1
          fi

      - name: Run deployed HVAC, Pharmacy and Grocery UI QA
        run: node scripts/qa-deployed-ui.mjs

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakbiz-deployed-ui-qa
          path: /tmp/lakbiz-ui-qa/*.png
          if-no-files-found: warn
          retention-days: 7
