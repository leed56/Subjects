name: LakBiz Demo Password Policy Check

on:
  pull_request:
    paths:
      - .github/workflows/lakbiz-demo-password-policy-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PHARMACY_OWNER: ${{ secrets.DEMO_PHARMACY_PASSWORD }}
      PHARMACY_CASHIER: ${{ secrets.DEMO_PHARMACY_CASHIER_PASSWORD }}
      GROCERY_OWNER: ${{ secrets.DEMO_GROCERY_PASSWORD }}
      GROCERY_CASHIER: ${{ secrets.DEMO_GROCERY_CASHIER_PASSWORD }}
    steps:
      - name: Check 12-character minimum without printing values
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          check() {
            local label="$1"
            local value="$2"
            if [ "${#value}" -ge 12 ]; then
              echo "$label=OK"
            else
              echo "$label=TOO_SHORT"
              bad=1
            fi
          }
          check DEMO_PHARMACY_PASSWORD "$PHARMACY_OWNER"
          check DEMO_PHARMACY_CASHIER_PASSWORD "$PHARMACY_CASHIER"
          check DEMO_GROCERY_PASSWORD "$GROCERY_OWNER"
          check DEMO_GROCERY_CASHIER_PASSWORD "$GROCERY_CASHIER"
          exit "$bad"
