name: LakBiz Retail POS Interaction Patch

on:
  pull_request:
    branches:
      - claude/job-parts-materials
    paths:
      - .github/lakbiz-pos-retail-patch.py
      - .github/workflows/lakbiz-pos-retail-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/global-premium-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0
      - name: Finalize and clean patch assets
        run: python .github/lakbiz-pos-retail-patch.py
      - name: Commit cleanup
        run: |
          git config user.name "lakbiz-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary retail POS patch runner"
          git push origin HEAD:claude/global-premium-ui
