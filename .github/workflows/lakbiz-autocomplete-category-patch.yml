name: LakBiz Autocomplete Category Patch

on:
  pull_request:
    branches:
      - claude/job-parts-materials
    paths:
      - .github/lakbiz-autocomplete-category-patch.py
      - .github/workflows/lakbiz-autocomplete-category-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/global-premium-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0
      - name: Apply autocomplete category patch
        run: python .github/lakbiz-autocomplete-category-patch.py
      - name: Commit application patch and remove temporary runner
        run: |
          git config user.name "lakbiz-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/lakbiz-autocomplete-category-patch.py .github/workflows/lakbiz-autocomplete-category-patch.yml
          git add lakbiz/app/src/lib/supabase/product-reference-catalog.ts lakbiz/app/src/components/product-form.tsx lakbiz/app/src/components/product-reference-combobox.tsx
          git commit -m "fix: make product autocomplete category-aware and drawer-safe"
          git push origin HEAD:claude/global-premium-ui
