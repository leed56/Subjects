name: LakBiz Grocery Taxonomy Patch

on:
  pull_request:
    branches:
      - claude/job-parts-materials
    paths:
      - .github/lakbiz-grocery-taxonomy-patch.py
      - .github/workflows/lakbiz-grocery-taxonomy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/global-premium-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0
      - name: Apply classifier regression patch
        run: python .github/lakbiz-grocery-taxonomy-patch.py
      - name: Commit patch and remove temporary runner
        run: |
          rm -f .github/lakbiz-grocery-taxonomy-patch.py .github/workflows/lakbiz-grocery-taxonomy-patch.yml
          git config user.name "lakbiz-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden grocery taxonomy classification"
          git push origin HEAD:claude/global-premium-ui
