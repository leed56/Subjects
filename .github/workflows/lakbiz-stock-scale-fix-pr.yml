name: LakBiz Stock Scale Fix PR

on:
  pull_request:
    branches:
      - claude/job-parts-materials
    paths:
      - .github/lakbiz-stock-scale-fix.trigger
      - .github/lakbiz-stock-scale-fix.py
      - .github/workflows/lakbiz-stock-scale-fix-pr.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/global-premium-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0
      - name: Apply exact patch
        run: python .github/lakbiz-stock-scale-fix.py
      - name: Commit patch
        run: |
          git config user.name "lakbiz-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: scale stock sync and tailor pharmacy grocery inventory UX"
          git push origin HEAD:claude/global-premium-ui
