name: LakBiz Regulatory Provenance One Shot

on:
  push:
    branches:
      - claude/global-premium-ui
    paths:
      - ".github/workflows/lakbiz-regulatory-provenance-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0

      - name: Patch regulatory provenance exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('lakbiz/app/scripts/demo-catalog/core.mjs')
          text = core.read_text()
          old = '''    regulatorySchedule: row.regulatory?.schedule ?? null,\n    regulatorySourceStatus: row.regulatory ? NMRA_PUBLIC_DATA_STATUS : null,\n    active: true,'''
          new = '''    regulatorySchedule: row.regulatory?.schedule ?? null,\n    regulatorySource: row.regulatory ? "mediverify" : null,\n    regulatorySourceUrl: row.regulatory?.sourceUrl ?? null,\n    regulatorySourceStatus: row.regulatory ? NMRA_PUBLIC_DATA_STATUS : null,\n    active: true,'''
          if old not in text:
              raise SystemExit('Refusing patch: normalized regulatory block not found')
          core.write_text(text.replace(old, new, 1))

          importer = Path('lakbiz/app/scripts/demo-catalog/importer.mjs')
          text = importer.read_text()
          old = '''      regulatorySchedule: product.regulatorySchedule,\n      regulatorySourceStatus: product.regulatorySourceStatus,\n      sourcePriceDate: product.sourcePriceDate,'''
          new = '''      regulatorySchedule: product.regulatorySchedule,\n      regulatorySource: product.regulatorySource,\n      regulatorySourceUrl: product.regulatorySourceUrl,\n      regulatorySourceStatus: product.regulatorySourceStatus,\n      sourcePriceDate: product.sourcePriceDate,'''
          if old not in text:
              raise SystemExit('Refusing patch: importer regulatory custom-fields block not found')
          importer.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/lakbiz-regulatory-provenance-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lakbiz/app/scripts/demo-catalog/core.mjs lakbiz/app/scripts/demo-catalog/importer.mjs
          git commit -m "fix(lakbiz): retain exact regulatory source provenance"
          git push origin HEAD:claude/global-premium-ui
