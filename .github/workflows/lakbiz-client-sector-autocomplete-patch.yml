name: LakBiz Client Sector Autocomplete Patch

on:
  pull_request:
    branches:
      - claude/job-parts-materials
    paths:
      - .github/lakbiz-client-sector-autocomplete-patch.py
      - .github/workflows/lakbiz-client-sector-autocomplete-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'claude/global-premium-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0
      - name: Apply exact patch
        run: python .github/lakbiz-client-sector-autocomplete-patch.py
      - name: Commit patch
        run: |
          git config user.name "lakbiz-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: hide client sector template and add product typeahead"
          git push origin HEAD:claude/global-premium-ui
