name: LakBiz Verify

on:
  pull_request:
    paths:
      - "lakbiz/app/**"
      - "lakbiz/supabase/migrations/**"
      - ".github/workflows/lakbiz-verify.yml"
  push:
    branches:
      - main
      - claude/job-parts-materials
      - claude/global-premium-ui
    paths:
      - "lakbiz/app/**"
      - "lakbiz/supabase/migrations/**"
      - ".github/workflows/lakbiz-verify.yml"

permissions:
  contents: read

concurrency:
  group: lakbiz-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lakbiz/app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lakbiz/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: i18n key parity
        run: npm run check:i18n

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install isolated textile UI QA tools
        shell: bash
        run: |
          set -euo pipefail
          textile_qa_tools="${RUNNER_TEMP}/lakbiz-textile-ui-tools"
          mkdir -p "$textile_qa_tools"
          npm install --prefix "$textile_qa_tools" --no-save --no-package-lock playwright@1.55.0 esbuild@0.28.2
          ln -s "$textile_qa_tools/node_modules/playwright" node_modules/playwright
          echo "TEXTILE_QA_ESBUILD=$textile_qa_tools/node_modules/esbuild" >> "$GITHUB_ENV"
          "$textile_qa_tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Textile checkout layout and interaction fixtures
        run: node scripts/qa-textile-pos.mjs
        env:
          LAKBIZ_UI_QA_DIR: ${{ runner.temp }}/lakbiz-textile-ui

      - name: Upload textile UI fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakbiz-textile-ui-fixtures
          path: |
            ${{ runner.temp }}/lakbiz-textile-ui/*.png
            ${{ runner.temp }}/lakbiz-textile-ui/results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Industry banner visual fixtures
        run: node scripts/qa-industry-banners.mjs
        env:
          LAKBIZ_UI_QA_DIR: ${{ runner.temp }}/lakbiz-industry-banners

      - name: Upload industry banner fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakbiz-industry-banner-fixtures
          path: |
            ${{ runner.temp }}/lakbiz-industry-banners/*.png
            ${{ runner.temp }}/lakbiz-industry-banners/results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stock screen state and navigation fixtures
        run: node scripts/qa-stock-states.mjs
        env:
          LAKBIZ_UI_QA_DIR: ${{ runner.temp }}/lakbiz-stock-states

      - name: Upload stock screen fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakbiz-stock-state-fixtures
          path: |
            ${{ runner.temp }}/lakbiz-stock-states/*.png
            ${{ runner.temp }}/lakbiz-stock-states/results.json
          if-no-files-found: warn
          retention-days: 7