name: LakBiz Verify

on:
  pull_request:
    paths:
      - "lakbiz/app/**"
      - "lakbiz/supabase/migrations/**"
      - ".github/workflows/lakbiz-verify.yml"
  push:
    branches:
      - claude/global-premium-ui
    paths:
      - "lakbiz/app/**"
      - "lakbiz/supabase/migrations/**"
      - ".github/workflows/lakbiz-verify.yml"

permissions:
  contents: read

concurrency:
  group: lakbiz-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lakbiz/app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lakbiz/app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
