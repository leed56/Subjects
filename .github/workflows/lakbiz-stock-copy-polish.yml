name: LakBiz Stock Copy Polish

on:
  push:
    branches:
      - claude/global-premium-ui
    paths:
      - .github/workflows/lakbiz-stock-copy-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lakbiz/app/package-lock.json
      - name: Remove duplicated plus marker from Stock CTA copy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lakbiz/app/src/lib/i18n/translations.ts')
          text = p.read_text()
          replacements = {
              '"stock.add_item": "+ භාණ්ඩය එකතු කරන්න",': '"stock.add_item": "භාණ්ඩය එකතු කරන්න",',
              '"stock.add_item": "+ Add item",': '"stock.add_item": "Add item",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Verify
        working-directory: lakbiz/app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lakbiz-stock-copy-polish.yml
          git config user.name "leed56"
          git config user.email "38248206+leed56@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: remove duplicate plus from stock action"
          git push origin HEAD:claude/global-premium-ui
