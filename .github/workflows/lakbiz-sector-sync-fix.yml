name: LakBiz Sector Sync One Shot

on:
  push:
    branches:
      - claude/global-premium-ui
    paths:
      - ".github/workflows/lakbiz-sector-sync-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0
      - name: Patch sector roundtrip exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lakbiz/app/src/lib/supabase/business-sync.ts')
          text = path.read_text()
          old = '''function asSectorId(value: string | null | undefined): SectorId {
            const allowed: SectorId[] = [
              "grocery",
              "electronics",
              "electricals",
              "spare_parts",
              "ac_hvac",
              "car_sales",
            ];
            return allowed.includes(value as SectorId) ? (value as SectorId) : "grocery";
          }'''
          new = '''function asSectorId(value: string | null | undefined): SectorId {
            const allowed: SectorId[] = [
              "grocery",
              "pharmacy",
              "electronics",
              "mobile_shop",
              "electricals",
              "spare_parts",
              "footwear",
              "ac_hvac",
              "car_sales",
            ];
            return allowed.includes(value as SectorId) ? (value as SectorId) : "grocery";
          }'''
          if new in text:
              print('Sector sync block already fixed; no change needed.')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('Refusing patch: expected sector block did not match exactly')
          PY
      - name: Commit exact patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lakbiz/app/src/lib/supabase/business-sync.ts
          git commit -m "fix(lakbiz): preserve all sector ids during sync"
          git push origin HEAD:claude/global-premium-ui
