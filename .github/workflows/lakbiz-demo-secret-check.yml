name: LakBiz Demo Secret Presence Check

on:
  push:
    branches:
      - claude/global-premium-ui
    paths:
      - .github/workflows/lakbiz-demo-secret-check.yml
  pull_request:
    paths:
      - .github/workflows/lakbiz-demo-secret-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PHARMACY_EMAIL: ${{ secrets.DEMO_PHARMACY_EMAIL }}
      PHARMACY_PASSWORD: ${{ secrets.DEMO_PHARMACY_PASSWORD }}
      PHARMACY_CASHIER_EMAIL: ${{ secrets.DEMO_PHARMACY_CASHIER_EMAIL }}
      PHARMACY_CASHIER_PASSWORD: ${{ secrets.DEMO_PHARMACY_CASHIER_PASSWORD }}
      GROCERY_EMAIL: ${{ secrets.DEMO_GROCERY_EMAIL }}
      GROCERY_PASSWORD: ${{ secrets.DEMO_GROCERY_PASSWORD }}
      GROCERY_CASHIER_EMAIL: ${{ secrets.DEMO_GROCERY_CASHIER_EMAIL }}
      GROCERY_CASHIER_PASSWORD: ${{ secrets.DEMO_GROCERY_CASHIER_PASSWORD }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          present() { if [ -n "$2" ]; then echo "$1=yes"; else echo "$1=no"; fi; }
          present SUPABASE_SERVICE_ROLE_KEY "$SERVICE_ROLE"
          present DEMO_PHARMACY_EMAIL "$PHARMACY_EMAIL"
          present DEMO_PHARMACY_PASSWORD "$PHARMACY_PASSWORD"
          present DEMO_PHARMACY_CASHIER_EMAIL "$PHARMACY_CASHIER_EMAIL"
          present DEMO_PHARMACY_CASHIER_PASSWORD "$PHARMACY_CASHIER_PASSWORD"
          present DEMO_GROCERY_EMAIL "$GROCERY_EMAIL"
          present DEMO_GROCERY_PASSWORD "$GROCERY_PASSWORD"
          present DEMO_GROCERY_CASHIER_EMAIL "$GROCERY_CASHIER_EMAIL"
          present DEMO_GROCERY_CASHIER_PASSWORD "$GROCERY_CASHIER_PASSWORD"
