name: LakBiz Login Policy Patch

on:
  push:
    branches: [claude/global-premium-ui]
    paths:
      - .github/workflows/lakbiz-login-policy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/global-premium-ui
          fetch-depth: 0

      - name: Enforce platform-admin-only shop creation in login UI
        shell: python
        run: |
          from pathlib import Path
          path = Path('lakbiz/app/src/app/login/page.tsx')
          text = path.read_text()
          old = '  const adminOnly = process.env.NEXT_PUBLIC_ADMIN_ONLY === "true";'
          new = '  // Shop/sector provisioning is exclusively a platform-admin operation.\n  const adminOnly = true;'
          if old not in text:
              raise SystemExit('Expected login adminOnly line not found; refusing blind patch')
          path.write_text(text.replace(old, new, 1))

      - name: Commit patch and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lakbiz-login-policy-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lakbiz/app/src/app/login/page.tsx .github/workflows/lakbiz-login-policy-patch.yml
          git commit -m "fix: make shop provisioning admin-only in login UI"
          git push origin HEAD:claude/global-premium-ui
